services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - /srv/itsm-data/uploads:/app/uploads
    expose:
      - "8000"
    networks:
      - itsm_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsm_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itsm_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  itsm_network:
    driver: bridge

